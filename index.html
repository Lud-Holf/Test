<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Little Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #74ebd5, #9face6);
            text-align: center;
            padding: 50px 20px;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            margin: 50px auto;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #6c63ff;
        }

        p {
            color: #555;
            font-size: 18px;
        }

        button {
            background: #6c63ff;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #5046e5;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Welcome to My Website! 🌟</h1>

        <p>Hello! Welcome to my little corner of the internet.</p>

        <p>I'm learning how to build websites with HTML and CSS!</p>

        <button onclick="showMessage()">Click Me!</button>

        <p id="message"></p>
    </div>

    <script>
        function showMessage() {
            document.getElementById("message").textContent =
                "Thanks for visiting my website! 🎉";
        }
    </script>

</body>
</html>
